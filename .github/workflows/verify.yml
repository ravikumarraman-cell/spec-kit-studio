name: Verify

on:
  pull_request:
    branches: [main, develop, skstudio/main, skstudio/develop]
  push:
    branches: [main, develop, skstudio/main, skstudio/develop]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.6.0
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Audit the exact lockfile
        run: npm audit --audit-level=low

  production-verification:
    name: Production verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.6.0
          cache: npm
      - run: npm ci
      - name: Install Chromium and Linux system dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - run: npm run verify:production
